name: Feature request
description: Propose a focused improvement to Afilmory.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the smallest useful behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
  - type: checkboxes
    id: impact
    attributes:
      label: Impact areas
      options:
        - label: Privacy or location data
        - label: Accessibility or keyboard interaction
        - label: Builder/cache compatibility
        - label: Bundle, manifest, or image performance
        - label: Deployment or storage configuration
